【CRM 的提出】客户关系管理（CRM, Customer Relationship Management）的定义由美国高德纳咨询公司（Gartner Group）在 1993 年前后提出。
【产生背景】市场竞争加剧、客户选择权增大、信息技术进步，使企业从"以产品为中心"转向"以客户为中心"。
【学习目标】了解客户关系管理的产生与发展；掌握客户关系营销理论；掌握客户关系管理的基本含义。`],["客户营销理论的演进：从 4P 到 4C 再到数据库营销",`【4P】产品 Product、价格 Price、渠道 Place、促销 Promotion。案例：特斯拉以创新产品＋撇脂定价＋直销模式＋创始人效应颠覆传统汽车行业。
【4C】消费者 Consumer、成本 Cost、便利 Convenience、沟通 Communication。案例：海底捞提供美甲、擦鞋、免费小吃等服务，降低顾客的非货币成本，与顾客建立情感连接。
【关键结论】从 4P 到 4C，标志着营销理念从"以企业为中心"向"以客户为中心"的革命性转变。
【关系营销】企业通过提供高质量的产品和服务维系与客户的关系（SCOPE 模型）。
【数据库营销（AI）】案例：台湾加乐实业导入带 AI 分析的 CRM 系统，挖掘历史客户的采购记录、沟通偏好与采购周期，提示业务员最佳跟进时机与方式，成功唤醒失联 15 年的加拿大客户重新下单。启示：Excel 只能"存"客户，AI 系统能"读懂"客户。`],["客户关系管理的内涵（铁三角）",`【概念拆解】客户：在一切与企业经营有关的环节中与企业有互动行为的组织或个人。关系：衡量指标为是否购买、是否喜欢、是否持久。管理：对组织资源进行计划、组织、领导和控制以达成目标的过程。
【CRM 定义】为提高企业竞争力，以客户满意为战略导向，开展客户选择、客户开发、客户保持和客户发展等商业活动的过程。
【铁三角】①客户是企业发展重要的资源之一，对企业与客户发生的各种关系进行全面管理，延伸企业供应链管理；②以技术为基础（CTI、BD、BI）；③以实施为抓手（营销、销售、服务、BPR），以获得客户满意、客户价值为目的。`],["CRM 的作用、研究视角与新发展",`【作用】提高市场营销效果；为生产研发提供决策支持；为财务金融策略提供决策支持；优化业务流程；提高快速响应与应变能力；改善服务、提高客户满意度；提高销售收入；推动企业文化变革等。
【研究视角】信息技术视角；组织结构与组织文化视角；营销学与心理学视角；资产增值视角。
【新发展】AI＋CRM：用 WorkBuddy 等工具基于产品知识库搭建智能客服，知识库本地化、口径可审定——这正是本课程"智客CRM"平台的设计理念。

【细分依据四变量】①地理变量（地区、城市规模、人口密度、气候）；②人口（人文）变量；③心理变量（社会阶层、生活方式、个性）；④行为变量（使用时机、使用者状况、使用率、品牌忠诚度、追求的利益、对产品的态度）。
【意义】有利于发掘市场机会、开拓新市场；有利于选择目标市场并制定营销策略；有利于集中人力物力投入目标市场；有利于提高经济效益。
【程序】麦卡锡"七步法"：确定营销目标→列出需求情况→初步细分→筛选→为细分市场定名→复核→选定目标市场并设计营销策略。
【方法】完全无细分、按一个因素细分、按两个因素细分、按系列因素细分、完全细分。`],["市场定位与客户细分",`【市场定位战略】可通过产品、价格、质量、款式、功能、顾客群体、使用场合、分销渠道、促销方式、服务、企业形象等差别化实现。

【客户细分目的】识别最有价值客户、忠诚客户、潜在客户、易流失客户，使高价值客户资源显性化，为决策提供量化依据。
【细分方式】按与企业关系：一般客户、企业客户、内部客户、渠道分销商和代销商；按客户价值；按产品服务视角：屈从型、关怀型、适应型、冷漠型。

【客户顺序模型】可结合信用等级—忠诚度、规模—忠诚度或三者组合，形成最具价值客户顺序模型。`],["客户 ABC 分类法与 RFM 模型",`【ABC 分类法】又称巴雷托分析法。A 类（关键客户）：约占 5%~15%，可能贡献 80% 销售额或利润，称"肥羊型"，要重点维护、高层关注、优先处理；B 类（主要客户）：约占 15%~25%，称"驯鹿型"，定期联络、针对性服务、挖掘潜力发展为 A 类；C 类（普通客户）：约占 75%，称"硕鼠型"，提供标准化基础服务、控制成本、发掘"明日之星"。
【经典算例】100 个客户传统拜访一年需 1200 小时；按 ABC 分类后（A10×24×1h＋B20×12×1h＋C70×6×0.5h）只需 690 小时，节省 510 小时。
【RFM 模型】R（最近一次消费时间间隔）：越小，客户价值越高；F（消费频率）：越大越好；M（消费金额）：越大越好。
【使用六步】计算 R/F/M 值→按价值打分→填分值→计算各维度平均值→标记各值高于/低于平均值→对照 RFM 分类表确定客户类型。
（对应本课程实训：本平台的"RFM 分层实训"即用此方法对脱敏客户数据分层。）`],["客户画像",`【概念沿革】1983 年交互设计之父阿兰·库珀提出 Persona 方法；2004 年亚马逊首次用行为数据构建实用画像；2016 年欧盟立法推动合规化画像。
【画像 vs 细分】客户细分是群体级分类（如"25-30 岁女性白领"），基于结构化数据、周期性更新，用于产品线与渠道策略；用户画像是个体级虚拟角色模型，基于实时行为数据、动态更新，用于个性化推荐与精准投放。
【标签体系】基础属性→兴趣偏好→消费能力→预测标签（案例：联通用户"中高端安卓机型长通话套餐买家"）。
【案例】同为"宝妈"，一线城市高知宝妈重品质效率、信科普媒体；三四线城市全职宝妈重性价比、信达人直播——营销话术与渠道完全不同。
【数据伦理（素养要求）】画像必须匿名化、脱敏化，营销须征得用户同意。反面案例：滴滴违规收集位置信息被罚 80.26 亿元；某电商平台大数据"杀熟"被罚。我国《个人信息保护法》第 66 条最高可处营业额 5% 罚款。`],["客户生命周期",`【理论提出】美国人 Dwyer 等人 1987 年提出客户关系生命周期概念：买卖双方关系分阶段发展，各阶段行为特征与利润贡献不同。
【五阶段】初识期→矜持期→平稳期→思异期→稳固期。思异期是分叉点：满意度降低或出现替代品则流失（终止），否则进入稳固期。
【各阶段 CRM 策略】建立阶段：说服客户、刺激客户；加强阶段：尽快从建立阶段过渡到维系阶段；维持阶段：提高客户满意度，尽量延长维系阶段的长度。
【客户开发策略演进】传统线下主导（扫街陌拜、黄页）→互联网兴起（门户广告、SEO）→移动互联网（二维码、APP 裂变、微信）→智能营销（大数据、KOL、私域流量）→全域融合（5G/AIoT、CDP 平台、数字人直播）。`]],quiz:[{type:"single",stem:"市场细分的依据变量不包括以下哪一项？",options:["地理变量","心理变量","行为变量","法律变量"],answer:3,analysis:"市场细分依据为地理、人口（人文）、心理、行为四大变量。"},{type:"single",stem:"按 ABC 分类法，A 类（关键）客户通常约占客户总数的多少？",options:["5%~15%","30%~40%","50% 左右","75% 左右"],answer:0,analysis:"A 类客户数量少（5%~15%）但贡献最大，可能贡献 80% 的销售额或利润。"},{type:"single",stem:"RFM 模型中，关于 R（最近一次消费时间间隔）的正确说法是？",options:["R 值越小，客户价值越高","R 值越大，客户价值越高","R 值与客户价值无关","R 表示消费总金额"],answer:0,analysis:"上一次消费离得越近（R 越小），客户价值越高；F、M 则是越大越好。"},{type:"judge",stem:"用户画像与客户细分是同一概念的不同说法。",options:["正确","错误"],answer:1,analysis:"画像是个体级、基于实时行为数据、动态更新；细分是群体级、基于结构化数据、周期性更新，二者在粒度、数据基础、动态性上均不同。"},{type:"single",stem:"客户关系生命周期的正确阶段顺序是？",options:["初识期→矜持期→平稳期→思异期→稳固期","认知期→成长期→成熟期→衰退期→终止期","初识期→平稳期→矜持期→稳固期→思异期","探测期→拓展期→分叉期→稳固期→终止期"],answer:0,analysis:"教材口径为初识、矜持、平稳、思异、稳固五阶段；思异期是分叉点，可能流失或进入稳固期。"}]},{code:"K3",title:"项目三（一） 大客户管理",source:"子模块一大客户管理.pptx",lessons:[["大客户的价值与识别",`【二八法则】由经济学家帕累托发现：通常 80% 的利润来自 20% 的重要客户。控制具有重要性的少数因子即能控制全局。
【马太效应】罗伯特·默顿提出：一旦在某方面获得成功，就会产生积累优势，获得更多机会——强者愈强。大客户能为企业带来行业辐射效应。
【大客户价值】①稳定的利润贡献来源；②行业客户中的辐射效应；③提升市场占有率；④企业创新的动力。
【谁是真大客户】消费频率高、消费量大、客户利润率高、对经营业绩有影响的关键客户。警惕三类"假大户"：偶尔大量消费的团购客户；需求量大但利润贡献差的重复消费客户；盘剥企业的"扒皮大户"。
【大客户条件】有大订单且有 1~2 年以上连续合约或较大潜力；有战略意义；对企业经营或形象有重要影响；有较强技术吸收创新能力；有较强市场发展实力。`],["大客户分析",`【与消费品客户的四大不同】①采购对象不同：大客户组织结构复杂，采购涉及领导、工程、财务、使用维护等多方人员；②采购金额不同：金额大且重复购买（如航空公司购客机一单数十亿元）；③营销方式不同：不受广告影响，需专业团队上门分析需求、定制方案、签订缜密合同；④服务要求不同：要求服务非常及时和全面。
【大客户分类】按层次：操作层（直接使用）、管理层（管理部门）、决策层（参与时间短但有决定权）；按职能：使用部门、技术部门（维护选型）、财务部门（审批资金）。
【戴尔键盘案例】同一产品，记者要手感、编辑要安静、技术部门看故障率、财务看性价比——不同角色关心点不同，产品介绍必须有针对性。`],["与大客户建立联系",`【情感营销】从消费者情感需要出发，唤起共鸣。科特勒将消费行为分为量的消费、质的消费、感情的消费三个阶段，当今已进入感情营销阶段。案例：孔府家酒借《北京人在纽约》热播，以"孔府家酒叫人想家"抓住家庭观念与新春探家时机，成为情感营销经典。
【大客户开发途径】维护老客户、重视新客户、老客户带新客户、VIP 招募、促销活动与口碑宣传、异业联盟、内部资源共享、日常开发。
【大客户关系发展五阶段】①孕育阶段：首笔小单，关系停留在采购经理层面；②初级阶段：技术、财务、商务等部门开始参与；③中级阶段：多部门、关键人结网，高层互动，客户不轻易换供应商；④高级阶段：资源整合、同步研发、为客户做自动化提升；⑤战略联盟阶段：战略合作共赢、资源互补、技术入股。
【案例】上海市政府与特斯拉的对赌合作（纳税、投资、国产化三承诺）带动临港 24 个重点项目——"鲶鱼效应"：引入外部竞争者激发整体活力。`],["大客户对服务的期待",`【五大期待】①积极热情的态度：大客户的问题必须第一时间积极解决，这是挽留大客户的最好方法；②标准化的服务体系：按流程处理问题、满足需求；③有特色的个性化服务：量身定做服务解决方案，变被动服务为主动服务；④主动服务：售前售中售后服务是"第二次竞争"，比客户先一步想到结果；⑤战略上的支持与合作：资源共享、优势互补，结成战略合作伙伴——这是客户服务的最高层次。
【菲利普·科特勒】"没有降低两分钱抵消不了的品牌忠诚。"大客户管理须在战略和策略层面打造成熟模式，识别大客户并通过个性化服务提高其满意度和忠诚度。`]],quiz:[{type:"single",stem:'"二八法则"（80%的利润来自20%的重要客户）是由谁发现的？',options:["帕累托","默顿","科特勒","德鲁克"],answer:0,analysis:'二八法则由经济学家和社会学家帕累托发现；默顿提出的是"马太效应"。'},{type:"single",stem:'下列哪类客户属于真正的"大客户"？',options:["偶尔一次大额团购的客户","长期稳定复购、利润率高的关键客户","需求量大但持续压价盘剥企业的客户","只采购低价处理品的客户"],answer:1,analysis:'真大客户消费频率高、量大、利润率高、对业绩有影响；其余三类是"假大户"。'},{type:"single",stem:"大客户与消费品客户的差异不包括以下哪一项？",options:["采购对象不同","采购金额不同","营销方式不同","付款币种不同"],answer:3,analysis:"四大差异为采购对象、采购金额、营销方式、服务要求。"},{type:"single",stem:"大客户关系发展的最高阶段是？",options:["孕育阶段","中级阶段","高级阶段","战略联盟阶段"],answer:3,analysis:"五阶段依次为孕育→初级→中级→高级→战略联盟，最高阶段形成战略合作与共赢。"},{type:"judge",stem:"菲利普·科特勒将人们的消费行为分为量的消费、质的消费和感情的消费三个阶段。",options:["正确","错误"],answer:0,analysis:"正确。当今营销环境已进入感情营销阶段，企业要晓之以理、动之以情。"}]},{code:"K4",title:"项目三（二） 建立大客户档案",source:"子模块二客户档案（理2）.pptx",lessons:[["大客户信息收集",`【四类资料】①客户组织资料：组织机构、通讯方式、使用/采购/支持部门、关键人员、同类产品使用情况、业务与行业状况；②竞争对手资料：产品使用情况、客户对其满意度、对手销售代表及其与客户的关系；③项目资料：采购计划、要解决的问题、决策人和影响者、时间表、预算、流程；④客户个人资料：家庭、教育、运动、饮食偏好、行程、工作目标、个人志向等。
【案例】希尔顿酒店为每位住客建档：记得你是第几次入住、喜欢玫瑰、用餐要辣椒酱——通过收集与分析客户资料提供个性化服务，提升忠诚度。
【要点】必须充分搜集大客户背景资料，了解并挖掘需求，才能为分析资料、制定服务战略做好准备。`],['建立大客户档案与"麦凯66"',`【档案的作用】系统记录、保存、分析客户资料，区分潜在与现有客户，掌握销售状况与习惯，为后续交往人员提供有价值资料，便于制定具体销售政策。
【"麦凯66"】哈维·麦凯创立的客户资料表格，66 个问题全面了解客户，六个维度：①身份卡（基础信息、生日体征）；②教育链（求学轨迹制造共同话题）；③家庭网（配偶、纪念日、子女）；④事业图（职业轨迹预判风险）；⑤兴趣本（谨慎处理宗教等敏感信息）；⑥生活簿（消费偏好定制服务）。
【档案管理五要点】①熟悉问题倒背如流；②随时更新修正信息；③确保资料的隐密性；④抛砖引玉淡化问题（先自曝话题，避免客户有"被查户口"感）；⑤拜访结束做好记录。
【禁忌】❌ 直接要求客户填写 66 个问题；✅ 将问题拆解到日常对话中自然获取。
【案例】新加坡航空投入 3 亿多美元调研近 100 位常客，发现目标客户更在乎隐私与睡眠空间，推出"新航豪华套房"。`]],quiz:[{type:"single",stem:"大客户信息收集的资料类别不包括以下哪一项？",options:["客户组织资料","竞争对手资料","供应商股东资料","客户个人资料"],answer:2,analysis:"四类资料为：客户组织资料、竞争对手资料、项目资料、客户个人资料。"},{type:"single",stem:'"麦凯66"客户档案方法的核心是？',options:["用 66 个问题全面了解客户，制定贴合需求的策略","要求客户在 66 天内完成 66 次购买","对 66 个大客户进行统一管理","每年拜访客户 66 次"],answer:0,analysis:'"麦凯66"是哈维·麦凯创立的 66 问客户资料表格，覆盖身份、教育、家庭、事业、兴趣、生活六维。'},{type:"judge",stem:"为提高建档效率，销售人员应直接要求客户填写完整的 66 个问题表格。",options:["正确","错误"],answer:1,analysis:'这是禁忌操作。正确方式是将问题拆解到日常对话中，抛砖引玉、自然获取，避免客户有"被查户口"的排斥感。'},{type:"single",stem:"大客户档案管理要点不包括以下哪一项？",options:["随时更新修正信息","确保资料的隐密性","在团队内公开传阅全部客户隐私","拜访结束做好记录"],answer:2,analysis:"档案管理要求倒背如流、随时更新、保密、抛砖引玉、拜访记录；客户隐私必须保密。"},{type:"judge",stem:"客户档案涉及个人隐私，收集和使用时必须确保资料的隐密性。",options:["正确","错误"],answer:0,analysis:"正确。这与《个人信息保护法》的要求一致，也是本课程素养目标。"}]},{code:"K5",title:"项目三（三） 招标投标书",source:"子模块三招投标（理2+实2+汇2）.pptx",lessons:[["招投标基础概念",`【全过程七环节】招标（公告或邀请书招请竞争）→投标（按文件编制递交）→开标（当众公开开启并宣读）→评标（评标委员会评审，推荐 1-3 名中标候选人）→中标（确定中标人）→授标（发中标通知书）→签订合同（中标通知书发出后 30 天之内）。
【投标有效期】从开标截止日起算，投标文件在约定期限内保持法律效力（如 120 天），投标人对其中承诺负责。注意"日历天"与"工作日"的区别。
【废标】投标文件不符合法律强制性规定或招标文件实质性要求，失去评标资格的法定情形（如未盖章、迟到递交）。
【违法行为辨析】围标：供应商相互约定抬压报价使特定者中标；陪标：作"陪衬"确保另一供应商中标；串标（串通投标）：供应商之间或与采购人、代理机构、评审专家串通。三者均属违法，是政府采购专项整治对象。`],["招标方式、类型与招投标特点",`【招标方式】公开招标（无限竞争性，邀请不特定对象）；邀请招标（有限竞争性，邀请特定对象）。
【招投标类型】货物招标投标、工程招标投标、服务招标投标三类。
【招投标六特点】①公开性；②时间性；③组织性；④公平性和公正性；⑤一次性——投标人只能应邀一次性秘密报价（"一口价"），文件递交后不得撤回或作实质性修改；⑥规范性——按"编制招标文件→发布公告→投标→开标→评标→签订合同"的成熟程序进行。
【投标三特点】真实性（内容真实可信）、竞争性（展示优势力争中标）、针对性（针对招标条件提方案）。`],["投标实务流程",`【获取招标文件】中国政府采购网、公共资源交易平台、军队采购网、中国招标投标公共服务平台等官方渠道；商业平台如千里马招标网；资质核查用国家企业信用信息公示系统、信用中国、中国裁判文书网（查三年内行贿受贿记录并截图留存作佐证）。
【四个详读】①详读投标人须知前附表（关键条款、不可偏离条款）；②详读合同部分（结算方式、付款条件）；③详读技术需求（与技术人员充分交流）；④详读评分表（商务技术评分标准，制定投标策略）。
【投标书构成】商务部分：证明企业合法合格、资质齐全、报价合理（经济性与合规性）；技术部分：证明技术方案科学、可行、高效，能满足甚至超越技术要求。`],["招标书与投标书的写作",`【招标书四要素】明确项目名称；明确批量、型号和规模；说明招标的经济意义；明确招标范围和形式。格式：标题（单位+项目+文种）、前言（四要素）、主体（范围/对象/期限、投标条件、中标者权利义务、步骤、联系方法）、结尾（单位全称+日期）。
【投标书写作四环节】表明态度→介绍情况（项目状况、自身优势与困难、结论性看法）→说明投标内容（方针可行、基数适当、科学论证、措施有力）→提出保证事项。格式：标题、称谓、前言、主体（项目分析/经营方针/承包目标/可行性分析与措施/对招标者的要求）、结尾。
【语言要求】准确、简明、具体、明确。禁忌模糊词：①"酌情嘉奖"（标准不明）→改为"给予税后利润 X% 奖励"；②"适当处罚"→明确违约金比例与合同解除权；③"约 8000 万""10% 以上"→精确数字与基数；④"大专以上""多年经验"→"国家承认的本科及以上学历""5 年及以上经验"。`]],quiz:[{type:"single",stem:"中标通知书发出后，招标人与中标人应在多少天内签订合同？",options:["7 天","15 天","30 天","60 天"],answer:2,analysis:"中标通知书发出后 30 天之内，双方就文件问题谈判并签订合同书，招投标全过程完成。"},{type:"single",stem:"迎新晚会招标中，戏剧社与音乐社私下商量，戏剧社故意报高价衬托音乐社中标，这种行为属于？",options:["正常商业竞争","串通投标（围标/陪标）","公开招标","邀请招标"],answer:1,analysis:"供应商之间不正当协同、确保特定者中标，属于串通投标（围标、陪标），是违法行为。"},{type:"judge",stem:"投标文件递交后，投标人仍可撤回或对其中的实质性条款进行修改。",options:["正确","错误"],answer:1,analysis:'错误。招投标具有"一次性"特征：投标人只能一次性秘密报价（一口价），递交后不得撤回或作实质性修改。'},{type:"single",stem:'投标书"商务部分"的核心目标是？',options:["证明技术方案的创新性","证明企业资质合法合格、报价合理","展示企业文化的独特性","说明企业未来的发展愿景"],answer:1,analysis:"商务部分侧重经济与合规性：证明投标人合法、合格、可信赖，具备法定和商业资质且报价合理。"},{type:"single",stem:"下列哪一句符合招投标文书的语言要求？",options:["对经营有方者酌情嘉奖","完不成任务甘愿接受适当处罚","产值指标约为 8000 万元","乙方须支付合同总额 5% 的违约金"],answer:3,analysis:'招投标语言必须准确、具体、可量化；"酌情""适当""约"都是模糊表述的大忌。'}]},{code:"K6",title:"项目四 客户满意的获得与测量",source:"客户满意的获得与测量.pptx",lessons:[["客户关系的五种类型",`【由弱到强五种类型】①基本型：卖出产品后不再联系，一次性交易关系，最脆弱（如路边摊买水）；②被动型：鼓励客户有问题打电话来，企业被动响应（如家电客服热线）；③负责任型：售后不久主动联系、询问使用情况并收集反馈（如软件回访）；④能动型：不断主动联系、提供改进建议、推荐更适用产品（如银行客户经理）；⑤伙伴型：持续合作、共同寻找提升效率的方法，协作共赢的战略伙伴关系，最牢固（如微软为大客户定制协同办公方案）。
【选择逻辑】关系越深，客户心理感受越强、流失率越低；企业应根据客户价值选择合适的关系类型。`],["客户满意",`【定义】客户满意（Customer Satisfaction）是客户对企业及其产品或服务的满意程度，是一种主观感受与情感表现，是客户期望值（q0）与感知值（q1）的比较。
【特性】与客户的知识经验、收入状况、生活习惯、价值观念密切相关；不同层次客户对同一产品评价不同；满意程度随需求层次与客观条件变化，并非一成不变。
【峰终定律】心理学家丹尼尔·卡尼曼（2002 年诺贝尔经济学奖得主）提出：人们对一段经历的记忆与评价主要取决于高峰时刻（无论正负）与结束时的体验，而非整体平均。应用：海底捞的极致服务、酒店离店时的伴手礼——设计好峰值与终值体验。
【提升策略】提高感知价值（产品/服务/人员/形象价值），降低感知成本（货币/时间/精力/体力）。`],["客户满意度指数（CSI）模型",`【CSI 定义】站在用户角度评定产品或服务质量，运用计量经济模型计算测评结果，是对客户主观态度（定性）的客观测量（定量）。
【瑞典 SCSB 模型】最早的全国性满意度指数模型。前导变量：客户期望、价值感知；结果变量：客户投诉、客户忠诚度。
【美国 ACSI 模型】对瑞典模型的修正：将质量感知从价值感知中分离出来（产品质量感知、服务质量感知、总体质量感知）。
【欧洲 ECSI 模型】删掉客户投诉变量，加入"企业形象"作为影响满意度的因素。
【中国 CCSI 模型】1997 年起由中国质量协会等推动研究，用"品牌形象"取代欧洲模型中的"企业形象"；感知价值含"给定价格下对质量的感受"和"给定质量下对价格的感受"两个维度。

【关键数据】不抱怨的客户仅 9% 会回来；抱怨未解决 19%；抱怨得到解决 54%；抱怨被迅速解决的客户 82% 会回头。好体验告诉 3-4 人，坏体验告诉 12 人；只有 4% 的不满客户会告诉你；一个负面印象需要 12 个正面印象才能挽回。
